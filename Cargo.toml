[package]
name = "xmip-core-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract"
description = "Declared structure, validation and structural access contracts for Xmip."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[features]
# The Stream fixture a technology's tests read (fixture.rs). A technology
# enables it from its dev-dependencies, so nothing of it ships.
test-support = []

[dependencies]
xcore = { workspace = true }
# The standard Validate unit's declaration, and the stages it runs at.
node = { workspace = true }
stream = { workspace = true }
# The C boundary export.rs stands on: the header's tables, mirrored in Rust.
xmip_core_abi = { workspace = true }
# The `$ref` walk a JSON description shares (reference.rs, ADR-0044) reads
# with the parser the JSON technologies read with.
serde_json = "1"
# A `$ref` is a URI fragment: percent-decoded by the estate's one reader
# (codec::percent) before it is a JSON Pointer (reference.rs).
codec = { workspace = true }

[lints]
